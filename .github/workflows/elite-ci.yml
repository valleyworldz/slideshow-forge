name: Elite CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: elite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Audit · Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Generate CI photo fixtures
        run: npm run fixtures:ci -- --workspace

      - name: Lint (TypeScript)
        run: npm run lint

      - name: Consistency audit
        run: npm run audit:consistency

      - name: Production build (web + CLI)
        run: npm run build

      - name: Electron bundle
        run: npm run build:electron

      - name: Production E2E (26 checks)
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-output/e2e-report.json
          if-no-files-found: ignore
